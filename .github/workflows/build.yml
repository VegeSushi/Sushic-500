name: Build Standalone Emulator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-linux:
    name: Linux (Arch, x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm base-devel git verilator sdl2 python vim

      - name: Trust the workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cc65
        id: cache-cc65
        uses: actions/cache@v4
        with:
          path: /opt/cc65
          key: ${{ runner.os }}-cc65-master

      - name: Build cc65 from source
        if: steps.cache-cc65.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          make -C /tmp/cc65 PREFIX=/opt/cc65 install

      - name: Add cc65 to PATH
        run: echo "/opt/cc65/bin" >> $GITHUB_PATH

      - name: Build
        run: make all

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-linux-x86_64
          mkdir -p dist/sushic500-libretro-x86_64
          mkdir -p dist/sushic500-roms
          
          cp build/sushic500-emu dist/sushic500-linux-x86_64/
          cp build/sushic500_libretro.so dist/sushic500-libretro-x86_64/
          cp build/bios.hex build/charset.hex dist/sushic500-roms/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-linux-x86_64
          path: dist/sushic500-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-libretro-x86_64
          path: dist/sushic500-libretro-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-roms
          path: dist/sushic500-roms

  build-libretro-cross:
    name: Libretro core (Arch, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      matrix:
        include:
          - arch: arm64
            packages: aarch64-linux-gnu-gcc aarch64-linux-gnu-binutils
            prefix: aarch64-linux-gnu
          - arch: riscv64
            packages: riscv64-linux-gnu-gcc riscv64-linux-gnu-binutils
            prefix: riscv64-linux-gnu
    steps:
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm base-devel git verilator curl python vim ${{ matrix.packages }}

      - name: Trust the workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cc65
        id: cache-cc65
        uses: actions/cache@v4
        with:
          path: /opt/cc65
          key: ${{ runner.os }}-cc65-master

      - name: Build cc65 from source (host tool)
        if: steps.cache-cc65.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          make -C /tmp/cc65 PREFIX=/opt/cc65 install

      - name: Add cc65 to PATH
        run: echo "/opt/cc65/bin" >> $GITHUB_PATH

      - name: Build BIOS/charset hex (host, native)
        run: make rom charset

      - name: Build libretro core (cross to ${{ matrix.arch }})
        run: |
          make libretro CC=${{ matrix.prefix }}-gcc CXX=${{ matrix.prefix }}-g++

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-libretro-${{ matrix.arch }}
          cp build/sushic500_libretro.so dist/sushic500-libretro-${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-libretro-${{ matrix.arch }}
          path: dist/sushic500-libretro-${{ matrix.arch }}

  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Install toolchain
        run: |
          brew update
          brew install verilator sdl2 python cc65

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Standalone Emulator Only
        run: |
          export CPLUS_INCLUDE_PATH="$(brew --prefix)/include"
          export C_INCLUDE_PATH="$(brew --prefix)/include"
          # Only run the targets required for the standalone emulator, skipping libretro
          make rom cart charset emu

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-macos
          cp build/sushic500-emu dist/sushic500-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-macos
          path: dist/sushic500-macos

  export-cpp-source:
    name: Export C++ Source (For Native Android APK)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install Verilator and toolchain
        run: |
          pacman -Sy --noconfirm base-devel git verilator python vim

      - name: Trust the workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cc65
        id: cache-cc65
        uses: actions/cache@v4
        with:
          path: /opt/cc65
          key: ${{ runner.os }}-cc65-master

      - name: Build cc65 from source
        if: steps.cache-cc65.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          make -C /tmp/cc65 PREFIX=/opt/cc65 install

      - name: Add cc65 to PATH
        run: echo "/opt/cc65/bin" >> $GITHUB_PATH

      - name: Build BIOS and Charset ROMs
        run: make rom charset

      - name: Generate C++ Model via Verilator
        run: |
          mkdir -p build/cpp_model
          
          verilator -cc \
            -Wno-WIDTHEXPAND -Wno-WIDTHTRUNC -Wno-CASEX -Wno-CASEINCOMPLETE -Wno-UNOPTFLAT \
            -Wno-SIDEEFFECT -Wno-CASEOVERLAP \
            -Mdir build/cpp_model \
            -Ihw -Iext/verilog-6502 \
            --top-module sushic500_top \
            hw/sushic500_top.v hw/sys_ram.v hw/sys_rom.v hw/cart_rom.v hw/char_rom.v hw/mc6847.v ext/verilog-6502/cpu.v ext/verilog-6502/ALU.v
          
      - name: Stage C++ Source Package
        run: |
          mkdir -p dist/sushic500-cpp-source/model
          mkdir -p dist/sushic500-cpp-source/verilator_runtime
          mkdir -p dist/sushic500-cpp-source/src
          mkdir -p dist/sushic500-cpp-source/assets

          # 1. The generated Verilator C++ classes
          cp -r build/cpp_model/* dist/sushic500-cpp-source/model/

          # 2. The Verilator standard runtime
          cp -r /usr/share/verilator/include/* dist/sushic500-cpp-source/verilator_runtime/

          # 3. Your wrapper source code
          cp -r emu libretro dist/sushic500-cpp-source/src/

          # 4. Built ROM files
          cp build/bios.hex build/charset.hex dist/sushic500-cpp-source/assets/

      - name: Patch Verilator runtime for Android (Bionic has no pthread_getaffinity_np)
        run: |
          RUNTIME_HDR="dist/sushic500-cpp-source/verilator_runtime/verilatedos_c.h"
          if grep -q '__TERMUX__' "$RUNTIME_HDR"; then
            sed -i \
              's/#ifdef __TERMUX__/#if defined(__TERMUX__) || defined(__ANDROID__)/' \
              "$RUNTIME_HDR"
            echo "Patched $RUNTIME_HDR for Android/Bionic compatibility."
          else
            echo "WARNING: __TERMUX__ guard not found — Verilator version differs, patch skipped. Check manually." >&2
            exit 1
          fi
          
      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-cpp-source
          path: dist/sushic500-cpp-source

  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-libretro-cross, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's package
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
