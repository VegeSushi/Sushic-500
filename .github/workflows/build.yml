name: Build Standalone Emulator

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-linux:
    name: Linux (Arch, x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install toolchain
        run: |
          pacman -Sy --noconfirm base-devel git verilator sdl2 python vim

      - name: Trust the workspace directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cc65
        id: cache-cc65
        uses: actions/cache@v4
        with:
          path: /opt/cc65
          key: ${{ runner.os }}-cc65-master

      - name: Build cc65 from source
        if: steps.cache-cc65.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          make -C /tmp/cc65 PREFIX=/opt/cc65 install

      - name: Add cc65 to PATH
        run: echo "/opt/cc65/bin" >> $GITHUB_PATH

      - name: Build
        run: make all

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-linux-x86_64
          mkdir -p dist/sushic500-libretro-x86_64
          mkdir -p dist/sushic500-roms
          
          cp build/sushic500-emu dist/sushic500-linux-x86_64/
          cp build/sushic500_libretro.so dist/sushic500-libretro-x86_64/
          cp build/bios.hex build/charset.hex dist/sushic500-roms/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-linux-x86_64
          path: dist/sushic500-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-libretro-x86_64
          path: dist/sushic500-libretro-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-roms
          path: dist/sushic500-roms

  build-cross:
    name: Cross-compile (Linux, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            deb_arch: arm64
            packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libsdl2-dev:arm64
            prefix: aarch64-linux-gnu
          - arch: riscv64
            deb_arch: riscv64
            packages: gcc-riscv64-linux-gnu g++-riscv64-linux-gnu libsdl2-dev:riscv64
            prefix: riscv64-linux-gnu
    steps:
      - name: Install cross-toolchain and SDL2
        run: |
          sudo dpkg --add-architecture ${{ matrix.deb_arch }}
          sudo apt-get update
          sudo apt-get install -y verilator curl python3 vim \
            ${{ matrix.packages }}

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache cc65
        id: cache-cc65
        uses: actions/cache@v4
        with:
          path: /opt/cc65
          key: ubuntu-cc65-master

      - name: Build cc65 from source (host tool)
        if: steps.cache-cc65.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/cc65/cc65.git /tmp/cc65
          make -C /tmp/cc65 -j"$(nproc)"
          sudo make -C /tmp/cc65 PREFIX=/opt/cc65 install

      - name: Add cc65 to PATH
        run: echo "/opt/cc65/bin" >> $GITHUB_PATH

      - name: Build BIOS/charset hex (host, native)
        run: make rom charset

      - name: Build emulator and libretro core (cross to ${{ matrix.arch }})
        run: |
          export CC=${{ matrix.prefix }}-gcc
          export CXX=${{ matrix.prefix }}-g++
          export LINK=${{ matrix.prefix }}-g++
          
          make emu libretro

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-linux-${{ matrix.arch }}
          mkdir -p dist/sushic500-libretro-${{ matrix.arch }}
          
          cp build/sushic500-emu dist/sushic500-linux-${{ matrix.arch }}/
          cp build/sushic500_libretro.so dist/sushic500-libretro-${{ matrix.arch }}/

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-linux-${{ matrix.arch }}
          path: dist/sushic500-linux-${{ matrix.arch }}
          
      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-libretro-${{ matrix.arch }}
          path: dist/sushic500-libretro-${{ matrix.arch }}

  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Install toolchain
        run: |
          brew update
          brew install verilator sdl2 python cc65

      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Standalone Emulator Only
        run: |
          export CPLUS_INCLUDE_PATH="$(brew --prefix)/include"
          export C_INCLUDE_PATH="$(brew --prefix)/include"
          # Only run the targets required for the standalone emulator, skipping libretro
          make rom cart charset emu

      - name: Stage package
        run: |
          mkdir -p dist/sushic500-macos
          cp build/sushic500-emu dist/sushic500-macos/

      - uses: actions/upload-artifact@v4
        with:
          name: sushic500-macos
          path: dist/sushic500-macos

  release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux, build-cross, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each platform's package
        run: |
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$name" && zip -r "../${name}.zip" .)
          done

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip